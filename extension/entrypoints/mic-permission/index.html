<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iris: microphone</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8f6;
        --text: #1c2b2a;
        --muted: #55655f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1615;
          --text: #e6eeec;
          --muted: #a3b3af;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font:
          17px/28px system-ui,
          sans-serif;
      }
      main {
        max-width: 440px;
        padding: 24px 16px;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        line-height: 28px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Microphone for Iris</h1>
      <p id="status" role="status">Allow the microphone in the prompt above.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
