<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your cart – Sample Shop</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 0;
        color: #1f2933;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 16px 160px;
      }
      .line {
        display: flex;
        justify-content: space-between;
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your cart</h1>
      <div class="line"><span>Travel backpack</span><span>₹2,299</span></div>
      <p>Prices include taxes. Delivery is free on orders over ₹999.</p>
      <h2>Gift messages</h2>
      <p>
        Add a gift message at checkout and we'll print it on a card inside the parcel. Gift messages
        can be up to 200 characters long and are printed exactly as you type them.
      </p>
      <p><a id="to-checkout" href="/pages/checkout.html">Go to checkout</a></p>
    </main>
  </body>
</html>
