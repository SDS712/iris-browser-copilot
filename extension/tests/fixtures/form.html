<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open an account – Sample Lender</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 0;
        color: #1f2933;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 16px 96px;
      }
      fieldset {
        border: 1px solid #d0d7de;
        border-radius: 12px;
        padding: 16px;
        margin: 0 0 20px;
      }
      .row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 14px;
      }
      input,
      select {
        font: inherit;
        padding: 8px 10px;
        border: 1px solid #9aa5b1;
        border-radius: 8px;
      }
      small {
        color: #52606d;
        font-size: 13px;
      }
      .check {
        flex-direction: row;
        align-items: flex-start;
        gap: 8px;
      }
      button {
        font: inherit;
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        background: #3e4c59;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Open an account</h1>
      <form id="apply">
        <fieldset>
          <legend>Your details</legend>
          <div class="row">
            <label for="full-name">Full name</label>
            <input id="full-name" name="full_name" type="text" required />
          </div>
          <div class="row">
            <label for="pan">PAN</label>
            <input
              id="pan"
              name="pan"
              type="text"
              placeholder="ABCDE1234F"
              aria-describedby="pan-help"
              required
            />
            <small id="pan-help">10 characters, as printed on your PAN card</small>
          </div>
          <div class="row">
            <label for="dob">Date of birth</label>
            <input id="dob" name="dob" type="date" required />
          </div>
          <div class="row">
            <label for="mobile">Mobile number</label>
            <input id="mobile" name="mobile" type="tel" required />
          </div>
          <div class="row">
            <label for="otp">OTP</label>
            <input
              id="otp"
              name="otp"
              type="text"
              autocomplete="one-time-code"
              placeholder="6 digits"
            />
          </div>
          <div class="row">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" />
          </div>
          <div class="row">
            <label for="employment">Employment type</label>
            <select id="employment" name="employment">
              <option value="">Choose one</option>
              <option>Salaried</option>
              <option>Self-employed</option>
              <option>Student</option>
            </select>
          </div>
        </fieldset>
        <fieldset>
          <legend>Bank and security</legend>
          <div class="row">
            <label for="account">Bank account number</label>
            <input id="account" name="account" type="text" placeholder="XXXX XXXX 4321" required />
          </div>
          <div class="row">
            <label for="ifsc">IFSC</label>
            <input id="ifsc" name="ifsc" type="text" placeholder="e.g. ABCD0123456" required />
          </div>
          <div class="row">
            <label for="ckyc">CKYC number (optional)</label>
            <input id="ckyc" name="ckyc" type="text" />
          </div>
          <div class="row">
            <label for="card">Debit card number</label>
            <input
              id="card"
              name="card"
              type="text"
              inputmode="numeric"
              placeholder="1234 5678 9012 3456"
            />
          </div>
          <div class="row">
            <label for="password">Create a password</label>
            <input id="password" name="password" type="password" />
          </div>
        </fieldset>
        <div class="row check">
          <input id="offers" name="offers" type="checkbox" checked />
          <label for="offers">Send me offers from partners on WhatsApp and SMS</label>
        </div>
        <div class="row check">
          <input id="agree" name="agree" type="checkbox" required />
          <label for="agree"
            >I agree to the <a href="terms.html">Terms</a> and the
            <a href="#privacy">Privacy Policy</a></label
          >
        </div>
        <button type="submit">Submit application</button>
      </form>
    </main>
    <script>
      document
        .getElementById('apply')
        .addEventListener('submit', (event) => event.preventDefault());
    </script>
  </body>
</html>
