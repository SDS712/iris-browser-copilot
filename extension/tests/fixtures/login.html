<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in – Sample Bank</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 0;
        color: #1f2933;
      }
      main {
        max-width: 420px;
        margin: 0 auto;
        padding: 48px 16px;
      }
      label {
        display: block;
        margin-top: 16px;
      }
      input {
        display: block;
        width: 100%;
        padding: 8px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign in to NetBanking</h1>
      <p>Enter your customer ID and password to continue to your accounts.</p>
      <form action="#" onsubmit="return false;">
        <label for="customer">Customer ID</label>
        <input id="customer" name="customer" type="text" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" />
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
