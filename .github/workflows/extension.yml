name: extension

on:
  push:
    paths:
      - "extension/**"
      - "backend/openapi.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - "backend/openapi.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/extension.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    env:
      # Production builds need an API base; CI never talks to a real backend.
      IRIS_API_BASE: http://localhost:8000/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: API types match backend/openapi.json
        run: pnpm gen:api && git diff --exit-code src/core/api-types.ts
      - run: pnpm build
      - run: pnpm build:widget
      - run: pnpm size
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install the backend (started in fake mode by Playwright)
        working-directory: backend
        run: uv sync --frozen
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: extension/playwright-report/
